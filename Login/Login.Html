<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <title>Inicio de sesión - Sistema Clínico</title>
    <link rel="stylesheet" href="Login.css">
</head>
<body>
    <main class="conteiner_login">
        
        <!-- SECCIÓN IZQUIERDA: Hero de Bienvenida -->
       <section class="hero_section">
            <div class="hero_content">
                <div class="hero_icon">
                    <img src="imagen.png" alt="Logo Veterinaria M&L" class="hero_logo">
                </div>
                <h1 class="hero_title">Veterinaria M&L</h1>
                <p class="hero_subtitle">Gestión integral, segura y eficiente para la atención de tus mascotas. Acceda a su panel de control para continuar.</p>
            </div>
        </section>
        <!-- SECCIÓN DERECHA: Formulario de Login -->
        <section class="form_section">
            <div class="login_content">
                <div class="login_header">
                    <h2 class="form_titulo">Iniciar Sesión</h2>
                    <p class="form_subtitle">Ingrese sus credenciales de acceso</p>
                </div>  

                <form id="loginForm" class="form_registro">
                    <div class="form_campo">
                        <label class="form_label" for="email">Usuario</label>
                        <div class="input-icon" data-icon="👤">
                            <input class="form_input" type="text" id="email" placeholder="Ingresa tu nombre de usuario" required>
                        </div>
                    </div>
                    
                    <div class="form_campo">
                        <label class="form_label" for="password">Contraseña</label>
                        <div class="input-icon" data-icon="🔒">
                            <input class="form_input" type="password" id="password" placeholder="••••••••" required>
                        </div>
                    </div>
                    
                    <button class="form_butom" type="submit">Entrar</button>
                </form>
            </div>
        </section>

        <!-- PANTALLA DE CARGA (Intacta para JS) -->
        <div id="pantallaCarga" class="pantalla-carga">
            <div class="loader-contenido">
                <img src="imagen.png" alt="Logo Veterinaria">
                <h2>Veterinaria M&L</h2>
                <div class="loader"></div>
                <p>Iniciando sesión...</p>
            </div>
        </div>

    </main>

    <script src="Login.JS"></script>
</body>
</html>
